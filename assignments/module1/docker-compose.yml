x-app: &app
  build:
    context: ../..
    dockerfile: Dockerfile
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092,kafka-2:29092

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.0.1
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "/usr/bin/kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 5s
      timeout: 15s
      retries: 5
      start_period: 15s
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-2:
    image: confluentinc/cp-kafka:7.0.1
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9093:9092"
    healthcheck:
      test: [ "CMD", "/usr/bin/kafka-topics", "--bootstrap-server", "kafka-2:29092", "--list" ]
      interval: 5s
      timeout: 15s
      retries: 5
      start_period: 15s
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
      - kafka-2
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092,kafka-2:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181     
#      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

#  schema-registry:
#    image: confluentinc/cp-schema-registry:7.0.1
#    depends_on:
#      - kafka
#    ports:
#      - "8081:8081"
#    environment:
#      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092,PLAINTEXT://kafka-2:29092
#      SCHEMA_REGISTRY_HOST_NAME: schema-registry
#      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  kafka-init:
    image: confluentinc/cp-kafka:7.0.1
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ./create-topics.sh:/scripts/create-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
      kafka-2:
        condition: service_healthy

  single-message-consumer:
    <<: *app
    command: [ "module1.SingleMessageConsumerKt" ]
    deploy:
      replicas: 2
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  batch-consumer:
    <<: *app
    command: [ "module1.BatchConsumerKt" ]
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  producer:
    <<: *app
    command: [ "module1.ProducerKt" ]
    depends_on:
      kafka-init:
        condition: service_completed_successfully

volumes:
  kafka-data:
  kafka-2-data:
  zookeeper-data:
  zookeeper-log:
