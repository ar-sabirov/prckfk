name: kafka-module2-java

x-app: &app
  image: kafka-module2-java-app:local
  build:
    context: ../..
    dockerfile: Dockerfile
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092

services:
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "127.0.0.1:19093:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:19093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

  ksqldb:
    image: confluentinc/cp-ksqldb-server:8.1.6
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:18089:8088"
    environment:
      KSQL_BOOTSTRAP_SERVERS: kafka:29092
      KSQL_LISTENERS: http://0.0.0.0:8088
      KSQL_KSQL_SERVICE_ID: module2_java_
      KSQL_KSQL_STREAMS_REPLICATION_FACTOR: "1"
      KSQL_KSQL_INTERNAL_TOPIC_REPLICAS: "1"
      KSQL_KSQL_SINK_REPLICAS: "1"
      KSQL_HEAP_OPTS: "-Xms128m -Xmx512m"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/info"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
      ksqldb-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:18081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: module2_java
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KSQLDBSERVER: http://ksqldb:8088

  kafka-init:
    <<: *app
    command: ["module2_java.ChatTopicSetup"]
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy

  demo-init:
    <<: *app
    entrypoint: ["/bin/sh", "/demo/init.sh"]
    restart: "no"
    volumes:
      - ./demo/init.sh:/demo/init.sh:ro
      - demo-state:/var/lib/chat-demo
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  ksqldb-init:
    image: confluentinc/cp-ksqldb-server:8.1.6
    entrypoint: ["ksql"]
    command: ["http://ksqldb:8088", "--file", "/sql/ksqldb-queries.sql"]
    restart: "no"
    volumes:
      - ./ksqldb:/sql:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      ksqldb:
        condition: service_healthy

  ksqldb-check:
    image: confluentinc/cp-ksqldb-server:8.1.6
    profiles: ["tools"]
    entrypoint: ["ksql"]
    command: ["http://ksqldb:8088", "--file", "/sql/test-queries.sql"]
    volumes:
      - ./ksqldb:/sql:ro
    depends_on:
      ksqldb-init:
        condition: service_completed_successfully

  commands:
    <<: *app
    profiles: ["tools"]
    entrypoint:
      - java
      - -Dorg.slf4j.simpleLogger.defaultLogLevel=warn
      - -cp
      - /app/app.jar
      - module2_java.ChatCommands
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  chat:
    <<: *app
    command: ["module2_java.ChatApplication"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_APPLICATION_ID: module2-java-chat
      KAFKA_STATE_DIR: /var/lib/chat-streams
    volumes:
      - chat-state:/var/lib/chat-streams
    depends_on:
      demo-init:
        condition: service_completed_successfully
      ksqldb-init:
        condition: service_completed_successfully

  consumer:
    <<: *app
    command: ["-Dorg.slf4j.simpleLogger.defaultLogLevel=warn", "module2_java.ChatConsumer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_CONSUMER_GROUP_ID: module2-java-chat-logger
    depends_on:
      chat:
        condition: service_started

volumes:
  kafka-data:
  chat-state:
  demo-state:
