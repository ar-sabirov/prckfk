name: kafka-module2

x-app: &app
  image: kafka-module2-app:local
  build:
    context: ../..
    dockerfile: Dockerfile
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092

services:
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "127.0.0.1:19092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

  kafka-init:
    <<: *app
    command: ["module2.ChatTopicSetupKt"]
    depends_on:
      kafka:
        condition: service_healthy

  chat:
    <<: *app
    command: ["module2.ChatApplicationKt"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_APPLICATION_ID: module2-chat
      KAFKA_STATE_DIR: /var/lib/chat-streams
    volumes:
      - chat-state:/var/lib/chat-streams
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  producer:
    <<: *app
    command: ["-Dorg.slf4j.simpleLogger.defaultLogLevel=warn", "module2.ChatProducerKt"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SENTENCE_SOURCE_URL: "${SENTENCE_SOURCE_URL:-https://gist.githubusercontent.com/romaklimenko/c95f3a864828f7f034b7a33d1676e420/raw/warandpeace.txt}"
      PRODUCER_INTERVAL_MS: "${PRODUCER_INTERVAL_MS:-1000}"
    depends_on:
      chat:
        condition: service_started

  consumer:
    <<: *app
    command: ["-Dorg.slf4j.simpleLogger.defaultLogLevel=warn", "module2.ChatConsumerKt"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_CONSUMER_GROUP_ID: module2-chat-logger
    depends_on:
      chat:
        condition: service_started

volumes:
  kafka-data:
  chat-state:
